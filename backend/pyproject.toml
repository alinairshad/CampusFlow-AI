[project]
name = "campusflow-ai-backend"
version = "0.1.0"
requires-python = "==3.11.*"

# FastAPI Cloud reads dependencies from here (not from requirements.txt when
# pyproject.toml is present). Keep these in sync with requirements.txt.
dependencies = [
    # Web framework — [standard] required by FastAPI Cloud runtime (fastapi run)
    "fastapi[standard]==0.115.0",
    "uvicorn[standard]==0.29.0",

    # Database
    "motor==3.4.0",
    "pymongo==4.7.2",

    # Validation & settings
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",

    # Auth
    "bcrypt==5.0.0",
    "python-jose[cryptography]==3.3.0",

    # Document processing
    "pdfplumber==0.11.0",
    "python-docx==1.1.2",

    # PDF generation (LOCKED: ReportLab per tasks.md)
    "reportlab==4.2.0",

    # File upload
    "python-multipart==0.0.9",

    # HTTP client (LLM provider calls)
    "httpx==0.27.0",
]

[tool.fastapi]
# Tells FastAPI Cloud where to find the app object.
# Equivalent to: from app.main import app
entrypoint = "app.main:app"
